spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:./SpringBoot/.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/futari?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: ${FUTARI_UPLOAD_MAX_AUDIO_SIZE:64MB}
      max-request-size: ${FUTARI_UPLOAD_MAX_REQUEST_SIZE:80MB}
server:
  port: ${SERVER_PORT:8080}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
futari:
  jwt:
    secret: ${JWT_SECRET:}
    ttl-seconds: ${JWT_TTL_SECONDS:86400}
  storage:
    directory: ${MUSIC_STORAGE_DIR:./music-storage}
  updates:
    github-repository: ${FUTARI_UPDATE_GITHUB_REPOSITORY:ProgramCX/Futari-Music}
    directory: ${FUTARI_UPDATE_DIR:./updates}
    poll-enabled: ${FUTARI_UPDATE_POLL_ENABLED:true}
    poll-initial-delay-ms: ${FUTARI_UPDATE_POLL_INITIAL_DELAY_MS:0}
    poll-interval-ms: ${FUTARI_UPDATE_POLL_INTERVAL_MS:600000}
  upload:
    max-audio-size: ${FUTARI_UPLOAD_MAX_AUDIO_SIZE:64MB}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    nickname: ${BOOTSTRAP_ADMIN_NICKNAME:管理员}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    reset-existing: ${BOOTSTRAP_ADMIN_RESET_EXISTING:false}
